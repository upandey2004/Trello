server {
    listen 80;

    # 1. Route API requests to your FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Route Authentication requests to the local Supabase GoTrue container
    location /auth/v1/ {
        proxy_pass http://gotrue:9999/;
        proxy_set_header Host $http_host;
    }

    # 3. Route Database queries to the local Supabase PostgREST container
    location /rest/v1/ {
        proxy_pass http://postgrest:3000/;
        proxy_set_header Host $http_host;
    }
}
