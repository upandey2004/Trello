version: "3.8"

services:
  backend:
    build: ./backend
    container_name: trello_backend
    environment:
      # These will override the .env for the dockerized environment
      - SUPABASE_URL=http://nginx
      - SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIn0.RalYNqjkqY6B5tOgadu1q-8Y1oDYsd7KL6QOP24NOdc
    env_file:
      - ../.env
    depends_on:
      #- nginx
      - db
    networks:
      - trello_net

  nginx:
    image: nginx:alpine
    container_name: trello_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gotrue
      - postgrest
    networks:
      - trello_net

  db:
    # Use the official Supabase Postgres image which includes auth/storage schemas
    image: supabase/postgres:15.1.0.147
    container_name: trello_db
    environment:
      - POSTGRES_PASSWORD=your-super-secret-and-long-postgres-password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Initialize with our roles and the exported schema
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    networks:
      - trello_net

  postgrest:
    image: postgrest/postgrest:v11.2.0
    container_name: trello_postgrest
    environment:
      - PGRST_DB_URI=postgres://postgres:your-super-secret-and-long-postgres-password@db:5432/postgres
      - PGRST_DB_SCHEMA=public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=your-super-secret-jwt-token-with-at-least-32-characters-long
    depends_on:
      - db
    networks:
      - trello_net

  gotrue:
    image: supabase/gotrue:v2.108.0
    container_name: trello_auth
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - API_EXTERNAL_URL=http://localhost
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgres://postgres:your-super-secret-and-long-postgres-password@db:5432/postgres
      - GOTRUE_SITE_URL=http://localhost:5173
      - GOTRUE_JWT_SECRET=your-super-secret-jwt-token-with-at-least-32-characters-long
      - GOTRUE_JWT_EXP=3600
      - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
    depends_on:
      - db
    networks:
      - trello_net

volumes:
  db_data:

networks:
  trello_net:
    driver: bridge
